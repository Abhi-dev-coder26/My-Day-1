<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College — My Day</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="college">
  <header class="site-header">
    <a class="brand" href="index.html">My Day</a>
    <nav class="navigation" aria-label="Main navigation">
      <a href="index.html">Dashboard</a>
      <a href="diet.html">Diet</a>
      <a href="workout.html">Workout</a>
      <a class="active" href="college.html">College</a>
      <a href="daily-goals.html">Daily goals</a>
      <a href="goals.html">All goals</a>
    </nav>
  </header>
  <main>
    <section class="page-intro">
      <p class="muted" id="today-date"></p><h1>College</h1>
      <p>Manage your attendance and assignments.</p>
    </section>
    <section class="card">
      <div class="section-heading"><div><h2>Attendance</h2><p class="muted">Mark your attendance for today.</p></div><strong class="attendance-value" id="attendance-rate">0%</strong></div>
      <div class="attendance-details"><span><strong id="present-count">0</strong> days present</span><span><strong id="total-count">0</strong> total class days</span></div>
      <div class="progress-track"><div id="attendance-bar" class="progress-fill"></div></div>
      <p id="attendance-status" class="muted status-text"></p>
      <div class="button-row"><button type="button" class="button" id="present-button">Mark present</button><button type="button" class="button secondary" id="absent-button">Mark absent</button></div>
    </section>
    <section class="card">
      <div class="section-heading"><div><h2>Assignments</h2><p class="muted">Add assignments and mark them complete.</p></div><span class="count-label" id="assignment-count"></span></div>
      <div id="assignment-list" class="item-list"></div>
      <form class="add-form" id="assignment-form"><label class="sr-only" for="assignment-input">New assignment</label><input id="assignment-input" type="text" maxlength="70" placeholder="Add an assignment..." required><button class="button" type="submit">Add</button></form>
    </section>
  </main>
  <footer>Changes are saved on this device.</footer>
</body>
</html>
